<!-- Custom styles for news scroll section and glassmorphism effects -->
<style>
.news-scroll-section {
  max-height: 300px;
  overflow-y: auto;
  padding: 1em;
  margin-bottom: 2em;
  background: rgba(250, 251, 252, 0.8);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  font-size: 0.97em;
  line-height: 1.4;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
}
.news-scroll-section ul,
.news-scroll-section ol {
  margin: 0 0 0 1.2em;
  padding: 0;
}
.news-scroll-section li {
  margin-bottom: 0.3em;
}
.news-scroll-section hr,
.news-scroll-section .hr {
  margin: 0.5em 0;
}
.news-scroll-section p {
  margin-bottom: 0.5em;
}
.news-item {
  padding: 0.5em 0;
  border-bottom: 1px solid rgba(224, 224, 224, 0.3);
}
.news-item:last-child {
  border-bottom: none;
}

/* Glassmorphism for publication images */
.page__content #publications img {
  border-radius: 4px;
  transition: none;
  width: 180px;
  height: 120px;
  object-fit: cover;
  margin: 0.5em 0;
  display: block;
}

.page__content #publications img:hover {
  transform: none;
  box-shadow: none;
}

/* Publication titles styling */
.page__content #publications strong {
  font-size: 1.4em;
  font-weight: 700;
  color: #2c3e50;
  line-height: 1.4;
  display: block;
  margin-bottom: 0.8em;
}

/* Publication authors styling */
.page__content #publications span[style*="font-weight:500"] {
  font-size: 1.1em;
  margin-bottom: 0.5em;
  display: block;
}

/* Publication conference info styling */
.page__content #publications span[style*="font-weight:600"] {
  font-size: 1.05em;
  margin-bottom: 0.8em;
  display: block;
}

/* Publication links styling */
.page__content #publications a {
  margin-right: 0.5em;
  display: inline-block;
}

/* Glassmorphism for publication items */
.page__content #publications ul li {
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 16px;
  padding: 2.5em;
  margin-bottom: 2.5em;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
  position: relative;
  isolation: isolate;
}

.page__content #publications ul li:before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, #3498db, #e74c3c);
  border-radius: 16px 16px 0 0;
  z-index: 1;
}

/* Publications section spacing */
.page__content #publications {
  margin-top: 2em;
}

.page__content #publications ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
</style>
