<style>
.news-scroll-section {
  max-height: 220px;
  overflow-y: auto;
  padding: 0.5em 1em;
  margin-bottom: 2em;
  background: #fafbfc;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  font-size: 0.97em;
  line-height: 1.4;
}
.news-scroll-section ul,
.news-scroll-section ol {
  margin: 0 0 0 1.2em;
  padding: 0;
}
.news-scroll-section li {
  margin-bottom: 0.3em;

.news-scroll-section hr,
.news-scroll-section .hr {
  margin: 0.5em 0;
}
.news-scroll-section p {
  margin-bottom: 0.5em;
}
.news-item {
  padding: 0.5em 0;
  border-bottom: 1px solid #e0e0e0;
}
.news-item:last-child {
  border-bottom: none;
}
